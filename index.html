<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<title>ひかりを編む</title>
<style>
  :root { --bg:#111110; --panel:#1c1c1a; --card:#262624; --line:#2f2f2d; --fg:#f4f3ef; --sub:#8a8a85; --acc:#f4f3ef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans",sans-serif; user-select:none; overflow:hidden; }
  /* 画面に固定し、ページ自体はスクロールさせない（常に1画面に収める） */
  #app { max-width:560px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px 4px; gap:6px; flex:none; }
  header .ttl { font-size:14px; font-weight:600; flex:none; }
  header .presetBtn { font-size:11px; color:var(--sub); background:none; border:1px solid var(--line); border-radius:7px; padding:4px 8px; flex:none; }
  header .sp { flex:1; }
  header select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-size:12px; }
  header .btn { padding:7px 12px; font-size:12px; }

  /* プレビューは残りの高さを占める（パネルを開くと自動で縮む） */
  #previewWrap { padding:0 12px; flex:1 1 auto; min-height:90px; display:flex; }
  #previewBox { position:relative; flex:1; background:#000; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #previewCanvas { display:block; max-width:100%; max-height:100%; }
  #emptyHint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; text-align:center; padding:0 20px; }

  #transport { display:flex; align-items:center; justify-content:center; gap:14px; padding:4px 0 0; flex:none; }
  #playBtn { width:36px; height:36px; border-radius:50%; border:none; background:var(--acc); color:#191917; font-size:15px; cursor:pointer; flex:none; }
  #timeLabel { font-size:12px; color:var(--sub); min-width:86px; text-align:center; }

  /* タイムライン: 時間目盛 → クリップ帯 → 音楽トラック */
  #timelineWrap { position:relative; height:106px; margin:2px 0 0; flex:none; }
  #timelineScroll { position:absolute; inset:0; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x; }
  #timelineScroll::-webkit-scrollbar { display:none; }
  #timelineTrack { position:relative; height:100%; }
  #ruler { position:absolute; left:0; top:0; height:13px; }
  .tick { position:absolute; top:0; font-size:9px; color:var(--sub); padding-left:3px; border-left:1px solid var(--line); height:11px; line-height:11px; white-space:nowrap; }
  #clipLayer { position:absolute; left:0; top:14px; height:56px; }
  #musicLayer { position:absolute; left:0; top:74px; height:26px; }
  .musicBar { position:absolute; top:0; height:26px; border-radius:5px; background:#28352f; border:1px solid #3b524a; color:#cfe5dd; font-size:10px; line-height:24px; padding:0 8px; overflow:hidden; white-space:nowrap; cursor:pointer; }
  .musicBar.empty { background:none; border:1px dashed var(--line); color:var(--sub); }
  .clipBlock { position:absolute; top:0; height:56px; border-radius:6px; overflow:hidden; background-color:#333; background-size:cover; background-position:center; cursor:pointer; box-shadow:0 0 0 1px rgba(0,0,0,.5) inset; }
  .clipBlock.sel { box-shadow:0 0 0 2px var(--acc) inset; }
  .clipBlock.dragging { opacity:.85; z-index:20; box-shadow:0 0 0 2px var(--acc) inset, 0 4px 10px rgba(0,0,0,.5); }
  .clipBlock .lbl { position:absolute; right:3px; bottom:2px; font-size:9px; color:#fff; text-shadow:0 0 2px #000,0 0 2px #000; line-height:1; }
  .clipBlock .mk { position:absolute; left:3px; top:2px; font-size:11px; text-shadow:0 0 2px #000; line-height:1; }
  .trimHandle { position:absolute; top:0; bottom:0; width:15px; background:var(--acc); touch-action:none; z-index:10; }
  .trimHandle.left { left:0; border-radius:6px 0 0 6px; }
  .trimHandle.right { right:0; border-radius:0 6px 6px 0; }
  .trimHandle::after { content:''; position:absolute; left:50%; top:50%; width:2px; height:18px; background:#191917; transform:translate(-50%,-50%); border-radius:1px; }
  #playhead { position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--acc); transform:translateX(-1px); pointer-events:none; z-index:5; }
  #playhead::before { content:''; position:absolute; left:50%; top:-3px; width:8px; height:8px; background:var(--acc); border-radius:50%; transform:translateX(-50%); }
  #addClipWrap { position:absolute; right:6px; top:14px; z-index:15; }
  #addClipBtn { width:30px; height:56px; border-radius:8px; border:1px dashed var(--sub); background:rgba(17,17,16,.85); color:var(--fg); font-size:18px; }
  #addMenu { display:none; position:absolute; right:0; bottom:62px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; white-space:nowrap; }
  #addMenu.on { display:block; }
  #addMenu button { display:block; width:100%; background:none; border:none; color:var(--fg); font-size:13px; padding:10px 16px; text-align:left; }
  #addMenu button + button { border-top:1px solid var(--line); }

  nav { display:flex; border-top:1px solid var(--line); background:var(--panel); flex:none; }
  nav button { flex:1; background:none; border:none; color:var(--sub); font-size:11px; padding:8px 0 10px; cursor:pointer; }
  nav button .ic { display:block; font-size:17px; margin-bottom:2px; }
  nav button.on { color:var(--fg); font-weight:600; }

  /* パネルは画面の一部を占める引き出し。中身が長いときだけパネル内でスクロールする */
  .panel { display:none; background:var(--panel); padding:10px 14px 14px; flex:none; max-height:34vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .panel.on { display:block; }
  .row { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .row label { font-size:12px; color:var(--sub); flex:none; width:5.5em; }
  .row output { font-size:12px; color:var(--sub); flex:none; width:3em; text-align:right; }
  input[type=range] { flex:1; accent-color:var(--acc); min-width:0; }
  .btn { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:9px; padding:9px 14px; font-size:13px; cursor:pointer; }
  .btn.primary { background:var(--acc); color:#191917; border-color:var(--acc); font-weight:600; }
  .btn.sm { padding:7px 11px; font-size:12px; }
  .btn.on { background:var(--acc); color:#191917; border-color:var(--acc); }
  .btn:disabled { opacity:.4; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:16px; padding:6px 13px; font-size:12px; cursor:pointer; }
  .chip.on { background:var(--acc); color:#191917; border-color:var(--acc); font-weight:600; }
  .hint { font-size:11px; color:var(--sub); line-height:1.6; margin:6px 0; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; }
  .divider { border-top:0.5px solid var(--line); margin:10px 0; }
  .clipPanel { background:var(--card); border-radius:10px; padding:10px 12px; margin-top:4px; }
  .clipPanel .title { font-size:12px; color:var(--sub); margin:0 0 8px; }
  .actRow { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 4px; }
  label.chk { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--fg); }
  label.chk input { width:16px; height:16px; accent-color:var(--acc); }

  #exportProg { font-size:12px; color:var(--sub); margin:8px 0; min-height:1.3em; }
  #progBar { height:4px; background:var(--card); border-radius:2px; overflow:hidden; margin:6px 0; }
  #progFill { height:100%; width:0%; background:var(--acc); }
  #outVideo { width:100%; border-radius:10px; background:#000; margin-top:8px; display:none; }
  /* ログと開発ボタンはレイアウトを押し出さないよう浮かせる */
  #log { position:fixed; left:0; right:0; bottom:58px; z-index:40; margin:0; font-size:11px; color:#e08a86; white-space:pre-wrap; word-break:break-all; max-height:5em; overflow:auto; }
  #log:not(:empty) { padding:6px 14px; background:rgba(0,0,0,.85); }
  #devbar { display:none; position:fixed; left:4px; top:44px; z-index:45; flex-direction:column; gap:4px; }
  #devbar .btn { padding:4px 7px; font-size:10px; opacity:.75; }

  /* 新規プロジェクト/プリセット シート */
  #presetSheet { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); align-items:flex-end; justify-content:center; }
  #presetSheet.on { display:flex; }
  #presetSheetCard { width:100%; max-width:560px; background:var(--panel); border-radius:18px 18px 0 0; padding:18px 18px 26px; }
  #presetSheetCard h2 { font-size:15px; margin:0 0 14px; text-align:center; font-weight:600; }
  .presetCard { background:var(--card); border:2px solid transparent; border-radius:12px; padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px; cursor:pointer; text-align:left; width:100%; }
  .presetCard .pic { font-size:24px; flex:none; }
  .presetCard .pn { font-size:14px; margin:0; font-weight:600; }
  .presetCard .pd { font-size:10.5px; color:var(--sub); margin:3px 0 0; line-height:1.5; }
  #presetContinue { display:block; width:100%; background:none; border:none; color:var(--sub); font-size:12px; padding:8px 0 0; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="ttl">ひかりを編む</span>
    <button class="presetBtn" id="openPresetBtn">プリセット</button>
    <span class="sp"></span>
    <select id="aspectSel">
      <option value="16:9">16:9 よこ</option>
      <option value="9:16">9:16 たて</option>
      <option value="4:5">4:5</option>
    </select>
    <button class="btn primary" id="goExportBtn">書き出し</button>
  </header>

  <div id="previewWrap">
    <div id="previewBox">
      <canvas id="previewCanvas" width="960" height="540"></canvas>
      <div id="emptyHint">右下の＋から動画・写真を追加してください</div>
    </div>
  </div>

  <div id="transport">
    <span id="timeLabel">0:00 / 0:00</span>
    <button id="playBtn">▶</button>
    <span style="min-width:88px"></span>
  </div>

  <div id="timelineWrap">
    <div id="timelineScroll">
      <div id="timelineTrack">
        <div id="ruler"></div>
        <div id="clipLayer"></div>
        <div id="musicLayer"></div>
      </div>
    </div>
    <div id="playhead"></div>
    <div id="addClipWrap">
      <div id="addMenu">
        <button id="addVideoBtn">🎬 動画を追加</button>
        <button id="addPhotoBtn">🖼 写真を追加</button>
      </div>
      <button id="addClipBtn">＋</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/*" multiple hidden>
  <input type="file" id="photoFileInput" accept="image/*" multiple hidden>
  <input type="file" id="lutFileInput" accept=".cube" hidden>
  <input type="file" id="musicFileInput" accept="audio/*" hidden>

  <div id="devbar">
    <button class="btn sm" id="devClip">サンプル動画</button>
    <button class="btn sm" id="devPhoto">サンプル写真</button>
    <button class="btn sm" id="devMusic">サンプル音楽</button>
  </div>

  <div class="panel" id="panel-clips">
    <div class="row">
      <label>取り込み長さ</label>
      <select id="presetSel">
        <option value="2">先頭から2秒</option>
        <option value="3" selected>先頭から3秒</option>
        <option value="5">先頭から5秒</option>
        <option value="0">全部</option>
      </select>
      <button class="btn sm" id="applyLenBtn">取り込み済みにも適用</button>
    </div>
    <div class="row">
      <label>収め方</label>
      <select id="fitSel">
        <option value="contain" selected>切れないように収める</option>
        <option value="cover">画面いっぱい（切り抜き）</option>
      </select>
    </div>
    <div id="clipEdit" style="display:none">
      <div class="divider"></div>
      <div class="clipPanel">
        <p class="title" id="clipTitleLabel">クリップ 1</p>
        <div class="row"><label>明るさ補正</label><input type="range" id="clipBright" min="-100" max="100" value="0"><output>0</output></div>
        <div class="row"><label>色温度補正</label><input type="range" id="clipTemp" min="-100" max="100" value="0"><output>0</output></div>
        <p class="hint" id="autoReadout"></p>
        <div class="actRow">
          <button class="btn sm" id="moveL">◀ 前へ</button>
          <button class="btn sm" id="moveR">後ろへ ▶</button>
          <button class="btn sm" id="muteClipBtn">🔇 ミュート</button>
          <button class="btn sm" id="dupClip">複製</button>
          <button class="btn sm" id="delClip">削除</button>
        </div>
      </div>
    </div>
    <p class="hint" id="clipHint">クリップをタップで選択。端をドラッグでトリム、長押しで並び替え。2本指で時間の拡大・縮小。</p>
    <div class="divider"></div>
    <div class="row">
      <span class="hint" style="flex:1">編集内容は自動保存されます</span>
      <button class="btn sm" id="resetProject">新しく始める</button>
    </div>
  </div>

  <div class="panel" id="panel-color">
    <label class="chk"><input type="checkbox" id="autoAlignChk" checked> 自動そろえ（室内・屋外の差を均す）</label>
    <div class="divider"></div>
    <div class="chips" id="lutChips">
      <button class="chip" data-lut="mine" style="display:none">自分の色</button>
      <button class="chip" data-lut="airu" style="display:none">アイル</button>
      <button class="chip on" data-lut="hikari">ひかり</button>
      <button class="chip" data-lut="none">なし</button>
      <button class="chip" data-lut="file">＋ 自分のLUT (.cube)</button>
    </div>
    <div class="chips" id="fxChips" style="margin-top:10px">
      <button class="chip on" data-fx="0">質感なし</button>
      <button class="chip" data-fx="1">アイル（滲み）</button>
      <button class="chip" data-fx="2">8mmフィルム強め</button>
    </div>
    <p class="hint">色と質感は全クリップに一括で当たります。</p>
    <div class="row"><label>強さ</label><input type="range" id="uStrength" min="0" max="100" value="85"><output>85</output></div>
    <div class="row"><label>露出</label><input type="range" id="uExposure" min="-100" max="100" value="0"><output>0</output></div>
    <div class="row"><label>コントラスト</label><input type="range" id="uContrast" min="-100" max="100" value="0"><output>0</output></div>
    <div class="row"><label>彩度</label><input type="range" id="uSaturation" min="-100" max="100" value="0"><output>0</output></div>
    <div class="row"><label>フェード</label><input type="range" id="uFade" min="0" max="100" value="0"><output>0</output></div>
    <div class="row"><label>粒子の量</label><input type="range" id="uGrain" min="0" max="100" value="12"><output>12</output></div>
    <div class="row"><label>粒子の大きさ</label><input type="range" id="uGrainSize" min="50" max="400" value="100"><output>100</output></div>
    <div class="row"><label>レターボックス</label><input type="checkbox" id="uLetterbox" checked style="width:18px;height:18px;accent-color:var(--acc)"></div>
  </div>

  <div class="panel" id="panel-music">
    <label class="chk"><input type="checkbox" id="muteAllChk"> 元の音を消して、音楽だけにする</label>
    <p class="hint">オフなら元の音をそのまま書き出します（既定）。</p>
    <div class="divider"></div>
    <div class="row">
      <button class="btn" id="musicBtn">音楽を選ぶ</button>
      <span class="hint" id="musicName">未選択</span>
    </div>
    <div class="row"><label>音量</label><input type="range" id="musicVol" min="0" max="100" value="70"><output>70</output></div>
    <p class="hint">曲は自動でフェードイン・アウトし、作品の長さで切れます。</p>
  </div>

  <div class="panel" id="panel-export">
    <div class="row">
      <label>解像度</label>
      <select id="resSel"><option value="1080">1080p</option><option value="2160">4K</option></select>
      <span style="flex:1"></span>
      <button class="btn primary" id="runExport">書き出す</button>
    </div>
    <div id="progBar"><div id="progFill"></div></div>
    <div id="exportProg"></div>
    <video id="outVideo" controls playsinline></video>
    <div class="row" id="saveRow" style="display:none">
      <a class="btn" id="dlLink" download="ひかりを編む.mp4">保存</a>
      <button class="btn" id="shareBtn">共有</button>
    </div>
  </div>

  <nav>
    <button data-tab="clips"><span class="ic">🎞</span>クリップ</button>
    <button data-tab="color"><span class="ic">🎨</span>色</button>
    <button data-tab="music"><span class="ic">🎵</span>音楽</button>
    <button data-tab="export"><span class="ic">↑</span>書き出し</button>
  </nav>

  <pre id="log"></pre>
</div>

<div id="presetSheet">
  <div id="presetSheetCard">
    <h2>どちらで始めますか？</h2>
    <button class="presetCard" id="presetDiary">
      <span class="pic">📔</span>
      <span><p class="pn">日記</p><p class="pd">毎日をさっと残す。たて型・自分の色・そのままの音・3秒クリップ</p></span>
    </button>
    <button class="presetCard" id="presetMv">
      <span class="pic">🎬</span>
      <span><p class="pn">MV</p><p class="pd">作品として仕上げてSNSへ。よこ型・アイルの質感・音楽・2秒クリップ</p></span>
    </button>
    <button id="presetContinue">今のプロジェクトを続ける</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.3/dist/mp4box.all.min.js" crossorigin="anonymous"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
